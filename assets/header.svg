<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Lucas, Mobile and Web App Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#101A33"/>
    </linearGradient>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="450" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.25" stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="0.75" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="450 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#58A6FF" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="round"><rect width="900" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>

    <!-- drifting colour orbs -->
    <circle cx="140" cy="70" r="95" fill="#22D3EE" opacity="0.45" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 40;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="230" r="105" fill="#A78BFA" opacity="0.5" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 -30;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="300" r="80" fill="#F472B6" opacity="0.4" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;90 -30;0 0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="40" r="60" fill="#FB923C" opacity="0.3" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 30;0 0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- phone (mobile apps) -->
    <g transform="translate(62 62) rotate(-6 45 85)" filter="url(#glow)">
      <rect width="92" height="176" rx="16" fill="#0B1020" fill-opacity="0.7" stroke="#22D3EE" stroke-width="2.5"/>
      <rect x="32" y="8" width="28" height="5" rx="2.5" fill="#22D3EE" opacity="0.7"/>
      <rect x="12" y="30" width="68" height="14" rx="5" fill="#58A6FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="12" y="54" width="46" height="8" rx="4" fill="#A78BFA"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="12" y="70" width="56" height="8" rx="4" fill="#F472B6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="12" y="92" width="30" height="30" rx="8" fill="#22D3EE" opacity="0.8"/>
      <rect x="50" y="92" width="30" height="30" rx="8" fill="#FB923C" opacity="0.8"/>
      <rect x="12" y="130" width="30" height="30" rx="8" fill="#A78BFA" opacity="0.8"/>
      <rect x="50" y="130" width="30" height="30" rx="8" fill="#58A6FF" opacity="0.8"/>
    </g>

    <!-- browser window (web apps) -->
    <g transform="translate(722 66) rotate(5 60 60)" filter="url(#glow)">
      <rect width="130" height="110" rx="12" fill="#0B1020" fill-opacity="0.7" stroke="#F472B6" stroke-width="2.5"/>
      <path d="M0 24H130" stroke="#F472B6" stroke-width="2"/>
      <circle cx="14" cy="12" r="3.5" fill="#FB923C"/><circle cx="26" cy="12" r="3.5" fill="#FACC15"/><circle cx="38" cy="12" r="3.5" fill="#4ADE80"/>
      <text x="14" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#22D3EE">&lt;App/&gt;</text>
      <text x="14" y="72" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#A78BFA">{ ts }</text>
      <text x="14" y="92" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#FB923C">npm run dev</text>
    </g>

    <!-- floating code glyphs -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" font-weight="700">
      <text x="230" y="270" fill="#22D3EE" opacity="0.5">&lt;/&gt;<animate attributeName="y" values="270;40;270" dur="14s" repeatCount="indefinite"/></text>
      <text x="360" y="280" fill="#F472B6" opacity="0.5">{ }<animate attributeName="y" values="280;60;280" dur="11s" repeatCount="indefinite"/></text>
      <text x="560" y="275" fill="#A78BFA" opacity="0.5">=&gt;<animate attributeName="y" values="275;50;275" dur="16s" repeatCount="indefinite"/></text>
      <text x="650" y="285" fill="#FB923C" opacity="0.5">;<animate attributeName="y" values="285;70;285" dur="12s" repeatCount="indefinite"/></text>
    </g>

    <!-- title -->
    <text x="450" y="152" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,'Courier New',monospace" font-size="92" font-weight="800" letter-spacing="6" fill="url(#rainbow)" filter="url(#glow)">LUCAS</text>
    <text x="450" y="192" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="5" fill="#BFE3FF">MOBILE &#183; WEB &#183; APP DEVELOPER</text>

    <!-- terminal line with blinking cursor -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18">
      <text x="450" y="238" text-anchor="middle" fill="#8B9BB4"><tspan fill="#4ADE80">$</tspan> flutter run <tspan fill="#8B9BB4">&amp;&amp;</tspan> npm run dev<tspan fill="#22D3EE">&#9608;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="298" rx="21" fill="none" stroke="url(#rainbow)" stroke-width="2"/>
</svg>
