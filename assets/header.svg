<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Lucas - mobile and web developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#0D1B38"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#60A5FA" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="round"><rect width="900" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#dots)"/>

    <!-- one slow light source -->
    <ellipse cx="720" cy="60" rx="300" ry="180" fill="url(#glow)">
      <animate attributeName="cx" values="680;760;680" dur="14s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>

    <!-- text -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <text x="64" y="76" font-size="15" fill="#60A5FA" letter-spacing="1">
        <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>hello, i'm
      </text>
      <text x="64" y="138" font-size="64" font-weight="700" fill="#F1F5F9" letter-spacing="-1">
        <animate attributeName="opacity" values="0;1" dur="1s" begin="0.2s" fill="freeze" calcMode="linear"/>Lucas<tspan fill="#3B82F6">.</tspan>
      </text>
      <text x="64" y="176" font-size="17" fill="#94A3B8">
        <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>Mobile &amp; web developer<tspan fill="#475569"> / </tspan>Flutter, React, TypeScript<tspan fill="#3B82F6">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan>
      </text>
    </g>

    <!-- sweeping accent line -->
    <rect x="0" y="216" width="900" height="2" fill="#1E3A8A" fill-opacity="0.5"/>
    <rect y="216" width="300" height="2" fill="url(#line)">
      <animate attributeName="x" values="-300;900" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="899" height="219" rx="13.5" fill="none" stroke="#1E3A8A" stroke-opacity="0.8"/>
</svg>
