<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2" viewBox="0 0 900 2" role="presentation">
  <defs>
    <linearGradient id="s" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1" y="0.5" fill="#1E3A8A" fill-opacity="0.45"/>
  <rect width="260" height="1" y="0.5" fill="url(#s)">
    <animate attributeName="x" values="-260;900" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
